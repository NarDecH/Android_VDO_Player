name: CI

# The unit tests run on both platforms on purpose. The transfer tests start real
# loopback sockets, and a stopped listener does not behave the same everywhere: on
# Windows `close()` wakes a thread parked in `accept()`, on Linux it does not, so the
# closed port keeps answering on one platform and not the other. 1.2.0 shipped a bug
# of exactly that kind, and only the Ubuntu release run saw it. Running the suite on
# both systems means a platform-only failure shows up on the commit that caused it,
# long before a version tag turns it into a release.
#
# This is the gate for anything that reaches `main`; the release workflow runs the
# same test task on the machine that builds the APKs.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # A leaked token is the one failure the other jobs cannot make better, and both
  # checks below finish in seconds, so they run before anything slower.
  secret-scan:
    name: no committed credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the revision
        uses: actions/checkout@v7
        with:
          # The scan reads commits, not just the checked-out tree.
          fetch-depth: 0

      # Names first: `.gitignore` keeps a credential file out of a casual `git add`,
      # but it cannot stop `git add -f` or a file that was added before the rule
      # existed. This looks at what is actually tracked instead of what is meant to
      # be kept out.
      - name: Fail on a tracked credential file
        shell: bash
        run: bash .github/scripts/tracked-secret-files.sh

      # Then contents, because the usual accident is a key pasted into a source file
      # rather than a file of its own. Gitleaks is a single binary, so the release is
      # pinned and checked against the release's own SHA-256 list: a scanner whose
      # rules float starts failing commits that changed nothing. The CLI itself needs
      # no licence key (that applies to the GitHub Action, for organisations).
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          asset="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSLo "$asset" "$base/$asset"
          curl -fsSLo checksums.txt "$base/gitleaks_${version}_checksums.txt"
          grep -F "  $asset" checksums.txt | sha256sum --check -
          tar -xzf "$asset" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      # Only the commits this change adds. Re-reporting the whole history on every
      # run would bury today's mistake in yesterday's noise, and fixing old history
      # is a separate decision. A pull request scans against its base; a push scans
      # the range GitHub hands it, falling back to the first commit when the branch
      # has no `before`.
      - name: Scan the commits this change adds
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/${BASE_REF}..HEAD"
          elif printf '%s' "$BEFORE" | grep -Eq '^0+$'; then
            range="HEAD~1..HEAD"
          else
            range="${BEFORE}..${AFTER}"
          fi
          echo "scanning $range"
          # -v names the file, line and rule the way a developer needs to fix it;
          # --redact keeps the value out of the log, since a log that repeats the
          # secret widens the leak this job exists to stop.
          gitleaks git --redact=100 --exit-code 1 -v --log-opts="$range" .

  unit-tests:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the other: the point is to learn which
      # of the two broke.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out the revision
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The Windows image already carries the SDK, but asking for the same packages on
      # both platforms keeps the two jobs honest about what this project needs.
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # `shell: bash` on Windows (Git Bash is on the image) so the one wrapper script
      # in the repository is what both jobs run.
      - name: Run the unit tests
        shell: bash
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # A failed test run is only diagnosable from the JUnit XML: the Gradle console
      # output says which test failed, but not why.
      - name: Show the failing tests
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for report in app/build/test-results/testDebugUnitTest/*.xml; do
            if grep -q '<failure\|<error' "$report"; then
              echo "=== $report"
              head -c 4000 "$report"
              printf '\n'
            fi
          done

  # The JVM tests prove the wire protocol, the file names and the translations. They
  # cannot prove the one thing this app exists for: that a video decodes and a picture
  # reaches the screen. This job drives the real player on an emulator, so the platform
  # decoder, the bundled FFmpeg libraries and the live decoder switch each have to work.
  # It is the slowest and most valuable job in this file.
  playback-on-an-emulator:
    name: playback on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the revision
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The x86_64 emulator needs KVM; the runner has it, but the runner user is not
      # in the kvm group, so the device is made readable before the emulator starts.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The system image is the one part of this job that has nothing to do with the
      # commit: sdkmanager pulls about a gigabyte of it on every run just so the
      # emulator can boot. The key names the image, not the code, so a warm cache lasts
      # until the image itself changes.
      #
      # The AVD snapshot is deliberately *not* cached here. A snapshot carries the
      # guest's CPU state, and this job does not always land on a host with the same
      # CPU, so restoring another machine's snapshot is a boot failure waiting to
      # happen — the boot is paid for on every run on purpose.
      - name: Cache the emulator's system image
        uses: actions/cache@v6
        with:
          path: /usr/local/lib/android/sdk/system-images
          key: system-image-${{ runner.os }}-api34-google_apis-x86_64

      - name: Run the playback smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          # Deliberately one line: this action runs every line of `script:` as its own
          # shell invocation, so an `if`/`then`/`fi` block written here reaches `/bin/sh`
          # a line at a time and dies with "end of file unexpected (expecting fi)".
          # The gradle run and the intact-device diagnostics live in that script.
          script: bash .github/scripts/run-emulator-playback-test.sh

      # The instrumented report says which assertion failed, and unlike logcat it is
      # still on disk once the emulator is gone, so it is printed here as well: this
      # step survives a script that never got as far as its own diagnostics.
      - name: Show the failing instrumented tests
        if: failure()
        shell: bash
        run: |
          # Report names contain spaces and parentheses ("TEST-test(AVD) - 14.xml"), so
          # the paths are read NUL-separated instead of word-split.
          find app/build/outputs/androidTest-results app/build/reports/androidTests \
            -name '*.xml' -print0 2>/dev/null |
          while IFS= read -r -d '' report; do
            if grep -q '<failure\|<error' "$report"; then
              echo "=== $report"
              head -c 8000 "$report"
              printf '\n'
            fi
          done

      # Which test failed is in the report; what the run *did* is not: a green report
      # and a report with three of five tests skipped look identical in the console.
      # The per-test lines go to the job output, and one annotation is attached to the
      # run, so the counts are readable from the checks API without downloading
      # anything — the FFmpeg-only case is worth this much because it is the one test
      # that skips itself when its premise stops holding.
      - name: Summarise the instrumented run
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          results = []
          for path in glob.glob('app/build/outputs/androidTest-results/**/TEST-*.xml', recursive=True):
              for case in ET.parse(path).getroot().iter('testcase'):
                  outcome = 'passed'
                  if case.find('skipped') is not None:
                      outcome = 'SKIPPED'
                  elif case.find('failure') is not None:
                      outcome = 'FAILED'
                  elif case.find('error') is not None:
                      outcome = 'ERROR'
                  results.append((outcome, f"{case.get('classname', '').split('.')[-1]}.{case.get('name')}"))

          for outcome, name in results:
              print(f'{outcome:>8}  {name}')

          if not results:
              print('::warning title=Instrumented results::no results on disk')
              raise SystemExit(0)

          counts = {}
          for outcome, _ in results:
              counts[outcome] = counts.get(outcome, 0) + 1
          skipped = [name for outcome, name in results if outcome == 'SKIPPED']
          summary = ', '.join(f'{count} {outcome.lower()}' for outcome, count in sorted(counts.items()))
          note = f'{len(results)} instrumented test(s): {summary}'
          if skipped:
              note += ' (skipped: ' + ', '.join(skipped) + ')'
          print(f'::notice title=Instrumented results::{note}')
          PY

      # The steps above print an excerpt into the console, which is enough to see
      # *which* assertion failed. This keeps the rest — the full report, the
      # machine-readable XML and the logcat, dmesg and decoder list the script saved
      # while the emulator was still alive — so a failure can be diagnosed and fixed
      # without re-running the job just to read its output. Nothing is uploaded for a
      # green run: the artifact exists because a failure is what needs explaining.
      - name: Upload what the failure left behind
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-playback-failure
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            emulator-diagnostics/
          # A run can die before gradle produces a report; that must not replace the
          # real failure with a missing-file error.
          if-no-files-found: warn
          retention-days: 14
