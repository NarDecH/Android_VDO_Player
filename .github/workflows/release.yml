name: Release

# Cuts a GitHub release from a version tag: builds the per-ABI APKs, signs them
# with the repository's release key, and attaches them to the release.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 of vdo-release.jks, e.g. `base64 -w0 vdo-release.jks`
#   KEYSTORE_PASSWORD  store password (PKCS12 needs store == key password)
#   KEY_ALIAS          key alias, e.g. vdoplayer
#   KEY_PASSWORD       key password
#
# Without those secrets the workflow still builds and verifies, but the APKs are
# debug signed — which cannot upgrade an install signed with the release key, so a
# release published that way is only useful for testing.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release, e.g. v1.0.1'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # On a tag push this is the tag itself; on a manual run it is the tag named
      # in the input, so a dispatch can never build untagged code from main.
      - name: Check out the tagged revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # The credential scan below compares the tagged commit with its parent, and a
          # shallow clone has no parent to compare against.
          fetch-depth: 0

      # CI on `main` has already vetted the commit a tag usually points at, but nothing
      # enforces that a tag is cut from a commit that ran CI, and this is the job that
      # hands APKs to the world: a secret in the tagged commit would be published next
      # to the release, where deleting the tag later does not take it back. The same two
      # checks as CI, run before anything is built or signed.
      - name: Fail on a tracked credential file
        run: bash .github/scripts/tracked-secret-files.sh

      - name: Install gitleaks
        run: bash .github/scripts/install-gitleaks.sh

      # A tag push and a manual dispatch both arrive without a usable `before`, so the
      # script scans the tagged commit itself.
      - name: Scan the tagged commit for credentials
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: bash .github/scripts/scan-commits-for-secrets.sh

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The transfer protocol, the file-name sanitiser and the Thai translation are all
      # covered by JVM unit tests, so a release cannot ship with a broken wire format.
      - name: Run the unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # A failed test run is only diagnosable from the JUnit XML: the Gradle console
      # output says which test failed, but not why. Printing an excerpt for every
      # failing report keeps the reason at the end of the log, where it can be read
      # without downloading the whole archive.
      - name: Show the failing tests
        if: failure()
        run: |
          shopt -s nullglob
          for report in app/build/test-results/testDebugUnitTest/*.xml; do
            if grep -q '<failure\|<error' "$report"; then
              echo "=== $report"
              head -c 4000 "$report"
              printf '\n'
            fi
          done

      # Secrets are passed through the environment instead of being interpolated
      # into the script text, so a quote in a password cannot break the shell.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > vdo-release.jks
            {
              printf 'storeFile=vdo-release.jks\n'
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            } > keystore.properties
            echo "Release signing configured from repository secrets."
          else
            echo "::warning::KEYSTORE_BASE64 is not set — release APKs will be debug signed."
          fi

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # The draft's body is built from the APKs that are about to be uploaded, so the
      # sizes, digests and certificate on the release page are the files' own values —
      # not numbers retyped out of this run's summary. The script also fails the job
      # when the four files disagree on version or key, or are not v2 signed.
      - name: Verify the APKs and write the release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          bash .github/scripts/write-release-notes.sh \
            app/build/outputs/apk/release "$TAG" release-notes.md
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: VDO Player ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          draft: true
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk

      - name: Clean up signing material
        if: always()
        run: rm -f keystore.properties vdo-release.jks
