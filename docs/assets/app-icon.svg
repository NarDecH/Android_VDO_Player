<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="VDO Player icon">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#24356E"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="iconPlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFE0FF"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#iconBg)"/>

  <g filter="url(#iconShadow)">
    <rect x="52" y="72" width="152" height="112" rx="20"
          fill="none" stroke="#5EE1FF" stroke-width="7"/>
    <path d="M112 100 L112 156 L160 128 Z" fill="url(#iconPlay)"/>
  </g>

  <rect x="52" y="176" width="60" height="8" rx="4" fill="#FFC46B"/>
  <rect x="120" y="176" width="24" height="8" rx="4" fill="#5EE1FF" opacity="0.6"/>
</svg>
